<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 28px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 500;
        font-size: 14px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        transition: border-color 0.3s ease;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.1);
      }

      button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        margin-top: 10px;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      input.input-error {
        border-color: #dc3545 !important;
        box-shadow: 0 0 5px rgba(220, 53, 69, 0.2);
      }

      .error-message {
        color: #dc3545;
        font-size: 13px;
        margin-top: 5px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .message {
        margin-top: 20px;
        padding: 12px 15px;
        border-radius: 5px;
        text-align: center;
        font-weight: 500;
        display: none;
      }

      .message.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
        display: block;
      }

      .message.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Login</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username:</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
          />
          <div id="usernameError" class="error-message">
            Username is required
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
          />
          <div id="passwordError" class="error-message">
            Password is required
          </div>
        </div>

        <button type="submit">Login</button>
      </form>

      <div id="message" class="message"></div>
    </div>

    <script>
      // Validate username and password before login
      function validateLogin(username, password) {
        if (username === "admin" && password === "password") {
          return true;
        } else {
          return false;
        }
      }

      // Handle form submission
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Prevent form from submitting to a server

          // Get the input values from the form fields
          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value.trim();

          // Get input fields and error elements
          const usernameField = document.getElementById("username");
          const passwordField = document.getElementById("password");
          const usernameError = document.getElementById("usernameError");
          const passwordError = document.getElementById("passwordError");
          const messageElement = document.getElementById("message");

          // Clear previous error states
          usernameField.classList.remove("input-error");
          passwordField.classList.remove("input-error");
          usernameError.classList.remove("show");
          passwordError.classList.remove("show");
          messageElement.className = "message";

          // Validate username and password
          let isUsernameEmpty = username === "";
          let isPasswordEmpty = password === "";

          // Show error messages for empty fields
          if (isUsernameEmpty) {
            usernameField.classList.add("input-error");
            usernameError.classList.add("show");
          }

          if (isPasswordEmpty) {
            passwordField.classList.add("input-error");
            passwordError.classList.add("show");
          }

          // If either field is empty, don't proceed
          if (isUsernameEmpty || isPasswordEmpty) {
            return;
          }

          // Call validateLogin function
          if (validateLogin(username, password)) {
            // Show success message
            messageElement.textContent = "Login Successful!";
            messageElement.className = "message success";

            // Clear input fields
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
          } else {
            // Show error message
            messageElement.textContent = "Invalid username or password.";
            messageElement.className = "message error";
          }
        });
    </script>
  </body>
</html>
