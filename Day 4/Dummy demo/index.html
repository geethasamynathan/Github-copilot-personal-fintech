<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Product Registration Form - Register your purchased products and manage warranties"
    />
    <title>Product Registration Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main Container -->
    <div class="container">
      <!-- Header Section -->
      <header class="header">
        <h1>Product Registration</h1>
        <p class="subtitle">
          Register your product to activate warranty and access support
        </p>
      </header>

      <!-- Messages Container -->
      <div id="messagesContainer" class="messages-container">
        <!-- Error messages will be displayed here -->
        <div
          id="errorMessage"
          class="message message--error"
          style="display: none"
        ></div>
        <!-- Success message will be displayed here -->
        <div
          id="successMessage"
          class="message message--success"
          style="display: none"
        ></div>
      </div>

      <!-- Main Form -->
      <form id="registrationForm" class="form" novalidate>
        <!-- Product Information Section -->
        <fieldset class="form__fieldset">
          <legend class="form__legend">Product Information</legend>

          <div class="form__group">
            <label for="productName" class="form__label"
              >Product Name <span class="required">*</span></label
            >
            <input
              type="text"
              id="productName"
              name="productName"
              class="form__input"
              placeholder="e.g., Laptop, Refrigerator"
              required
            />
            <span id="productNameError" class="form__error"></span>
          </div>

          <div class="form__group">
            <label for="modelNumber" class="form__label"
              >Model/Serial Number <span class="required">*</span></label
            >
            <input
              type="text"
              id="modelNumber"
              name="modelNumber"
              class="form__input"
              placeholder="e.g., ABC-123-XYZ"
              required
            />
            <span id="modelNumberError" class="form__error"></span>
          </div>

          <div class="form__group">
            <label for="purchaseDate" class="form__label"
              >Purchase Date <span class="required">*</span></label
            >
            <input
              type="date"
              id="purchaseDate"
              name="purchaseDate"
              class="form__input"
              required
            />
            <span id="purchaseDateError" class="form__error"></span>
          </div>

          <div class="form__group">
            <label for="category" class="form__label"
              >Product Category <span class="required">*</span></label
            >
            <select id="category" name="category" class="form__input" required>
              <option value="">-- Select a category --</option>
              <option value="Electronics">Electronics</option>
              <option value="Home Appliances">Home Appliances</option>
              <option value="Computing Devices">Computing Devices</option>
              <option value="Mobile Devices">Mobile Devices</option>
              <option value="Audio Equipment">Audio Equipment</option>
              <option value="Other">Other</option>
            </select>
            <span id="categoryError" class="form__error"></span>
          </div>

          <div class="form__group">
            <label for="warranty" class="form__label"
              >Warranty Period <span class="required">*</span></label
            >
            <select id="warranty" name="warranty" class="form__input" required>
              <option value="">-- Select warranty period --</option>
              <option value="1 Year">1 Year</option>
              <option value="2 Years">2 Years</option>
              <option value="3 Years">3 Years</option>
              <option value="5 Years">5 Years</option>
              <option value="Lifetime">Lifetime</option>
            </select>
            <span id="warrantyError" class="form__error"></span>
          </div>
        </fieldset>

        <!-- Customer Information Section -->
        <fieldset class="form__fieldset">
          <legend class="form__legend">Customer Information</legend>

          <div class="form__group">
            <label for="fullName" class="form__label"
              >Full Name <span class="required">*</span></label
            >
            <input
              type="text"
              id="fullName"
              name="fullName"
              class="form__input"
              placeholder="John Doe"
              required
            />
            <span id="fullNameError" class="form__error"></span>
          </div>

          <div class="form__group">
            <label for="email" class="form__label"
              >Email Address <span class="required">*</span></label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="form__input"
              placeholder="john@example.com"
              required
            />
            <span id="emailError" class="form__error"></span>
          </div>

          <div class="form__group">
            <label for="phone" class="form__label"
              >Phone Number <span class="required">*</span></label
            >
            <input
              type="tel"
              id="phone"
              name="phone"
              class="form__input"
              placeholder="(555) 123-4567 or 5551234567"
              required
            />
            <span id="phoneError" class="form__error"></span>
          </div>

          <div class="form__group">
            <label for="country" class="form__label"
              >Country/Region <span class="required">*</span></label
            >
            <select id="country" name="country" class="form__input" required>
              <option value="">-- Select country --</option>
              <option value="United States">United States</option>
              <option value="Canada">Canada</option>
              <option value="United Kingdom">United Kingdom</option>
              <option value="Australia">Australia</option>
              <option value="Germany">Germany</option>
              <option value="France">France</option>
              <option value="Japan">Japan</option>
              <option value="India">India</option>
              <option value="Other">Other</option>
            </select>
            <span id="countryError" class="form__error"></span>
          </div>

          <div class="form__group">
            <label for="postalCode" class="form__label"
              >Postal Code <span class="optional">(optional)</span></label
            >
            <input
              type="text"
              id="postalCode"
              name="postalCode"
              class="form__input"
              placeholder="12345"
            />
            <span id="postalCodeError" class="form__error"></span>
          </div>
        </fieldset>

        <!-- Form Actions -->
        <div class="form__actions">
          <button type="submit" class="btn btn--primary">
            Register Product
          </button>
          <button type="reset" class="btn btn--secondary">Clear Form</button>
        </div>
      </form>

      <!-- Registered Products Section -->
      <section class="registered-products">
        <h2>Registered Products</h2>
        <div id="productsList" class="products-list">
          <p class="empty-message">
            No products registered yet. Fill out the form above to register your
            first product.
          </p>
        </div>
      </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2024 Product Registration System. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
