<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Course Registration</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>Student Course Registration</h1>
        <p>Register students for a course and manage saved registrations.</p>
      </header>

      <section class="form-section" aria-labelledby="registration-form-title">
        <h2 id="registration-form-title">Register a Student</h2>
        <form id="registration-form" autocomplete="off">
          <div class="form-group">
            <label for="student-name">Student Name</label>
            <input
              id="student-name"
              name="studentName"
              type="text"
              placeholder="Enter student name"
            />
          </div>

          <div class="form-group">
            <label for="student-email">Email</label>
            <input
              id="student-email"
              name="email"
              type="email"
              placeholder="Enter email address"
            />
          </div>

          <div class="form-group">
            <label for="course-select">Course</label>
            <select id="course-select" name="course">
              <option value="">Select a course</option>
              <option value="HTML Basics">HTML Basics</option>
              <option value="CSS Fundamentals">CSS Fundamentals</option>
              <option value="JavaScript Essentials">
                JavaScript Essentials
              </option>
              <option value="GitHub Copilot for Developers">
                GitHub Copilot for Developers
              </option>
            </select>
          </div>

          <button type="submit" class="primary-button">Register</button>
        </form>

        <div id="message-container" aria-live="polite"></div>
      </section>

      <section
        class="table-section"
        aria-labelledby="saved-registrations-title"
      >
        <h2 id="saved-registrations-title">Saved Registrations</h2>
        <table id="registrations-table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Email</th>
              <th>Course</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="registrations-body">
            <tr>
              <td colspan="4" class="empty-state">No registrations yet.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
